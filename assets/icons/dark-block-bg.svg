<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 819 460" fill="none">
  <!-- blueprint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="65" x2="819" y2="65"/>
    <line x1="0" y1="130" x2="819" y2="130"/>
    <line x1="0" y1="195" x2="819" y2="195"/>
    <line x1="0" y1="260" x2="819" y2="260"/>
    <line x1="0" y1="325" x2="819" y2="325"/>
    <line x1="0" y1="390" x2="819" y2="390"/>
    <line x1="65" y1="0" x2="65" y2="460"/>
    <line x1="130" y1="0" x2="130" y2="460"/>
    <line x1="195" y1="0" x2="195" y2="460"/>
    <line x1="260" y1="0" x2="260" y2="460"/>
    <line x1="325" y1="0" x2="325" y2="460"/>
    <line x1="390" y1="0" x2="390" y2="460"/>
    <line x1="455" y1="0" x2="455" y2="460"/>
    <line x1="520" y1="0" x2="520" y2="460"/>
    <line x1="585" y1="0" x2="585" y2="460"/>
    <line x1="650" y1="0" x2="650" y2="460"/>
    <line x1="715" y1="0" x2="715" y2="460"/>
    <line x1="780" y1="0" x2="780" y2="460"/>
  </g>

  <!-- gear top-left -->
  <g transform="translate(120,120)" fill="#FFFFFF" fill-opacity="0.35">
    <rect x="-7" y="-72" width="14" height="22" rx="5"/>
    <rect x="-7" y="-72" width="14" height="22" rx="5" transform="rotate(45)"/>
    <rect x="-7" y="-72" width="14" height="22" rx="5" transform="rotate(90)"/>
    <rect x="-7" y="-72" width="14" height="22" rx="5" transform="rotate(135)"/>
    <rect x="-7" y="-72" width="14" height="22" rx="5" transform="rotate(180)"/>
    <rect x="-7" y="-72" width="14" height="22" rx="5" transform="rotate(225)"/>
    <rect x="-7" y="-72" width="14" height="22" rx="5" transform="rotate(270)"/>
    <rect x="-7" y="-72" width="14" height="22" rx="5" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="18"/>
    <circle cx="0" cy="0" r="16"/>
  </g>

  <!-- hard hat center -->
  <g transform="translate(470,220)">
    <path d="M-105 0 a105 105 0 0 1 210 0 z" fill="#EA6249" fill-opacity="0.5"/>
    <rect x="-132" y="-4" width="264" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.4"/>
    <rect x="-76" y="-80" width="152" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.25"/>
  </g>

  <!-- wrench bottom-right -->
  <g transform="translate(680,360) rotate(28)">
    <rect x="-10" y="0" width="20" height="150" rx="10" fill="#FFFFFF" fill-opacity="0.3"/>
    <circle cx="0" cy="-14" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="16"/>
  </g>

  <!-- screwdriver bottom-left -->
  <g transform="translate(300,380) rotate(-22)">
    <rect x="-9" y="0" width="18" height="110" rx="9" fill="#FFFFFF" fill-opacity="0.28"/>
    <rect x="-6" y="-40" width="12" height="44" rx="4" fill="#FFFFFF" fill-opacity="0.2"/>
  </g>

  <!-- blocks -->
  <rect x="640" y="60" width="90" height="90" rx="12" fill="#FFFFFF" fill-opacity="0.12"/>
  <rect x="40" y="330" width="100" height="100" rx="14" fill="#EA6249" fill-opacity="0.2"/>

  <!-- accents -->
  <circle cx="770" cy="240" r="10" fill="#EA6249" fill-opacity="0.4"/>
  <rect x="360" y="60" width="46" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.14"/>
</svg>
