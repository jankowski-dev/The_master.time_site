<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" fill="none">
  <!-- backdrop -->
  <circle cx="220" cy="282" r="196" fill="#F9ECE7"/>

  <!-- floating accents -->
  <rect x="52" y="84" width="56" height="56" rx="12" fill="#D2C9C3" opacity="0.5"/>
  <circle cx="374" cy="120" r="14" fill="#EA6249" opacity="0.3"/>
  <rect x="348" y="452" width="44" height="44" rx="10" fill="#EA6249" opacity="0.22"/>

  <!-- gear -->
  <g transform="translate(110,152)" fill="#433B38">
    <rect x="-7" y="-62" width="14" height="20" rx="5"/>
    <rect x="-7" y="-62" width="14" height="20" rx="5" transform="rotate(45)"/>
    <rect x="-7" y="-62" width="14" height="20" rx="5" transform="rotate(90)"/>
    <rect x="-7" y="-62" width="14" height="20" rx="5" transform="rotate(135)"/>
    <rect x="-7" y="-62" width="14" height="20" rx="5" transform="rotate(180)"/>
    <rect x="-7" y="-62" width="14" height="20" rx="5" transform="rotate(225)"/>
    <rect x="-7" y="-62" width="14" height="20" rx="5" transform="rotate(270)"/>
    <rect x="-7" y="-62" width="14" height="20" rx="5" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#433B38" stroke-width="16"/>
    <circle cx="0" cy="0" r="15"/>
  </g>

  <!-- hammer -->
  <g transform="translate(356,250) rotate(20)">
    <rect x="-9" y="0" width="18" height="126" rx="9" fill="#433B38"/>
    <rect x="-44" y="-30" width="88" height="28" rx="9" fill="#EA6249"/>
  </g>

  <!-- hard hat -->
  <g transform="translate(224,322)">
    <path d="M-98 0 a98 98 0 0 1 196 0 z" fill="#EA6249"/>
    <rect x="-124" y="-4" width="248" height="24" rx="12" fill="#433B38"/>
    <rect x="-72" y="-74" width="144" height="16" rx="8" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- screwdriver -->
  <g transform="translate(96,398) rotate(-18)">
    <rect x="-8" y="0" width="16" height="96" rx="8" fill="#433B38"/>
    <rect x="-5" y="-34" width="10" height="38" rx="4" fill="#D2C9C3"/>
  </g>

  <!-- building blocks -->
  <rect x="92" y="446" width="82" height="82" rx="12" fill="#433B38"/>
  <rect x="182" y="414" width="82" height="114" rx="12" fill="#EA6249"/>
  <rect x="272" y="456" width="82" height="72" rx="12" fill="#D2C9C3"/>
</svg>
